[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tower"
version = "0.1.0"
description = "Unified MCP server consolidating domain name utilities from Seer and Tome"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zac Roach" }]
dependencies = [
    "mcp>=1.0",
    "seer>=0.10.2",
    "tome>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
tower-mcp = "tower.server:run"

[tool.hatch.build.targets.wheel]
packages = ["tower"]
