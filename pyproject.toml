[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tower"
version = "0.1.0"
description = "Unified MCP server consolidating domain name utilities from Seer and Tome"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zac Roach" }]
dependencies = [
    "mcp>=1.0",
    "seer>=0.10.2",
    "tome>=0.1.0",
    # Note: scrolls is NOT a Python import dependency of tower.
    # It is only needed at runtime via the uvx --with flag in .mcp.json.
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
tower-mcp = "tower.server:run"

[tool.hatch.build.targets.wheel]
packages = ["tower"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["tower"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
